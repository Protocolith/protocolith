name: docs

# Builds the documentation site on pull requests without deploying it.
on:
  pull_request:
    paths:
      - "docs_site/**"
      - "mkdocs.yml"
      - "scripts/build_docs_site.py"
      - "scripts/gen_cli_reference.py"
      - "src/protocolith/cli.py"
      - "docs/**"
      - "examples/quickstart/**"
      - "docs/assets/logo/**"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Command reference is up to date
        run: uv run python scripts/gen_cli_reference.py --check
      - name: Build site (strict)
        run: |
          uv run --extra docs python scripts/build_docs_site.py
          uv run --extra docs mkdocs build --strict
